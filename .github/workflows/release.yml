name: Release

# Push a tag vX.Y.Z (npm version patch|minor|major && git push --follow-tags)
# -> build, publish tabby-paneworks@X.Y.Z to npm, create the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (OIDC), no npm token stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        working-directory: dist
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
