name: Release

# Every push to main publishes a new version to npm.
# Version = <major>.<minor> from package.json + this workflow's run number as the patch,
# e.g. package.json 1.0.0 -> 1.0.17. Bump major/minor in package.json by hand when you want to.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write   # push the vX.Y.Z tag
  id-token: write   # npm trusted publishing (OIDC), no npm token stored

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Compute version
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Publishing $version"

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (skipped if this version is already published)
        working-directory: dist
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish"
          else
            npm publish --provenance --access public
          fi

      - name: Tag the commit
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
